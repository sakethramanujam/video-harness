[project]
name = "video-harness"
version = "0.1.1"
description = "DaVinci Resolve harness and MCP server for timeline placement and typed metadata markers."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.9.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
video-harness = "video_harness.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
video_harness = ["types.yaml", "scripts/*.py", "scripts/*.lua"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
