[project]
name = "video-harness"
version = "0.1.5"
description = "DaVinci Resolve harness and MCP server for timeline placement and typed metadata markers."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Saketha Ramanjam" }]
requires-python = ">=3.10"
keywords = ["davinci-resolve", "mcp", "video", "timeline"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "mcp>=1.9.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
video-harness = "video_harness.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
video_harness = ["types.yaml", "scripts/*.py", "scripts/*.lua"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
